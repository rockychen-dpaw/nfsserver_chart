{{- if hasKey $.Values "nfsserver" }}
apiVersion: v1
kind: Service
metadata:
  name: {{$.Release.Name}}-nfsserver-headless
  namespace: {{$.Release.Namespace}}
spec:
  clusterIP: None
  clusterIPs:
  - None
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: default
    port: 42
    protocol: TCP
    targetPort: 42
  selector:
    workload.user.cattle.io/workloadselector: apps.statefulset-{{ $.Release.Namespace}}-{{$.Release.Name}}-nfsserver
  sessionAffinity: None
  type: ClusterIP
{{- end }}
